<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Internet Shop</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main id="main">
            <header>
                <div class="headerBox">
                    <h2>IS</h2>
                    <h1>Internet Shop</h1>
                    <div class="headerButtons">
                        <p id="headerMain"><a href="#main">Главная</a></p>
                        <p id="headerShop"><a href="#product">Магазин</a></p>
                    </div>
                    <div class="headerRight" id="headerRight"></div>
                </div>
            </header>

            <div class="homepage">
                <h1>Internet Shop</h1>
                <p>Тут вы можете купить различную технику от Apple, Samsung и других производителей с нашей гарантией!</p>
                <a href="#product">Перейти к покупкам</a>
            </div>

            <div id="product"></div>

            <footer>
                <h1>Internet Shop</h1>
                <p>Subscribe into my Tiktok and Github ^-^</p>
                <p>My Links:</p>
                <div class="footerLinksMin">
                    <a href="https://www.tiktok.com/@akyyy0_0"><img src="images/TTLogo.webp"></a>
                    <a href="https://github.com/matvejminin2009"><img src="images/GHLogo.png"></a>
                </div>
                <div class="footerLinksMax">
                    <a href="https://www.tiktok.com/@akyyy0_0">TikTok</a>
                    <a href="https://github.com/matvejminin2009">GitHub</a>
                </div>
            </footer>
        </main>

        <template id="product-template">
            <div class="product">
                <img class="picture" alt=""></img>
                <h1 class="name"></h1>
                <p class="price"></p>
                <button>В корзину</button>
            </div>
        </template>

        <script src="JS/products.js"></script>
        <script src="JS/autorisation.js"></script>
    </body>
</html>
